<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e7e34">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KNU Notes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .header {
            background: #6a1b9a; color: white;
            padding: 18px 25px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        .header h2 { margin: 0; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-light { background: rgba(255,255,255,0.2); color: white; text-decoration: none; }
        .btn-danger { background: #c62828; color: white; }
        .btn-warning { background: #f9a825; color: #333; }
        .btn-primary { background: #6a1b9a; color: white; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f5f5f5; }
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }

        /* Advanced Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.65); display: none; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-box {
            background: white; padding: 30px; border-radius: 14px; width: 90%; max-width: 420px;
            transform: translateY(-30px); transition: transform 0.3s;
        }
        .modal-overlay.show .modal-box { transform: translateY(0); }
        .modal-box h3 { margin-top: 0; }
        .password-wrapper { position: relative; margin-top: 10px; }
        .password-wrapper input {
            width: 100%; padding: 12px; font-size: 15px; border: 1px solid #ccc;
            border-radius: 8px; box-sizing: border-box;
        }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #6a1b9a;
            font-size: 13px; font-weight: bold;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; padding: 11px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #e0e0e0; color: #333; }
        .btn-confirm-danger { background: #c62828; color: white; }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h2>Student Accounts</h2>
    </div>
    <div>
        <a href="dashboard.html" class="btn btn-light">Back to Dashboard</a>
        <button class="btn btn-light" onclick="logout()" style="margin-left:10px;">Logout</button>
    </div>
</div>

<div class="card">
    <h3>All Registered Students</h3>
    <div class="search-box">
        <input type="text" id="searchStudents" placeholder="Search by Name, Student Number, Email, Phone, School or Year..." oninput="filterStudents()">
    </div>
    <div id="studentsList">Loading...</div>
</div>

<!-- Reset Password Modal -->
<div class="modal-overlay" id="resetModal">
    <div class="modal-box">
        <h3 style="color:#6a1b9a;">Reset Password</h3>
        <p id="resetStudentLabel" style="color:#555;"></p>
        
        <label>New Password</label>
        <div class="password-wrapper">
            <input type="password" id="newPassInput" placeholder="Minimum 6 characters">
            <button type="button" class="toggle-password" onclick="toggleResetPassword()">Show</button>
        </div>
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeResetModal()">Cancel</button>
            <button class="btn btn-primary" onclick="confirmResetPassword()">Reset Password</button>
        </div>
    </div>
</div>

<!-- Advanced Delete Student Modal -->
<div class="modal-overlay" id="deleteStudentModal">
    <div class="modal-box">
        <h3 style="color:#c62828;">Delete Student Account</h3>
        <p id="deleteStudentText" style="color:#555; line-height:1.5;"></p>
        <p style="color:#888; font-size:14px;">This action is permanent and cannot be undone.</p>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeDeleteStudentModal()">Cancel</button>
            <button class="btn-confirm-danger" onclick="confirmDeleteStudent()">Delete Account</button>
        </div>
    </div>
</div>

<script>
    const DB_URL = "https://ivwpbwdzoikmwgfpefpc.supabase.co";
    const DB_KEY = "sb_publishable_Ex2EA-5ofhwLAVv-Dj7R1w_-PKvEkqU";
    const client = supabase.createClient(DB_URL, DB_KEY);

    if (sessionStorage.getItem("isMaster") !== "true") {
        alert("Access Denied");
        window.location.href = "dashboard.html";
    }

    let allStudents = [];
    let currentStudentId = null;
    let studentToDelete = null;

    async function loadStudents() {
        const { data, error } = await client
            .from("students")
            .select("*")
            .order("created_at", { ascending: false });
        allStudents = data || [];
        renderStudents(allStudents);
    }

    function renderStudents(list) {
        const container = document.getElementById("studentsList");
        if (!list || list.length === 0) {
            container.innerHTML = "<p>No students found.</p>";
            return;
        }
        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Student Number</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>School</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
        `;
        list.forEach(s => {
            const fullName = [s.first_name, s.middle_name, s.last_name].filter(Boolean).join(" ") || "—";
            html += `
                <tr>
                    <td>${fullName}</td>
                    <td>${s.student_number}</td>
                    <td>${s.email}</td>
                    <td>${s.phone || "-"}</td>
                    <td>${(s.school || "-").replace("-", " ")}</td>
                    <td>Year ${s.year}</td>
                    <td>
                        <button class="btn btn-warning" onclick="openResetModal('${s.id}', '${s.student_number}')">Reset Password</button>
                        <button class="btn btn-danger" onclick="openDeleteStudentModal('${s.id}', '${s.student_number}', '${fullName.replace(/'/g, "\\'")}')">Delete</button>
                    </td>
                </tr>
            `;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    function filterStudents() {
        const term = document.getElementById("searchStudents").value.toLowerCase();
        const filtered = allStudents.filter(s => {
            const fullName = [s.first_name, s.middle_name, s.last_name].filter(Boolean).join(" ").toLowerCase();
            return fullName.includes(term) ||
                (s.student_number || "").toLowerCase().includes(term) ||
                (s.email || "").toLowerCase().includes(term) ||
                (s.phone || "").toLowerCase().includes(term) ||
                (s.school || "").toLowerCase().includes(term) ||
                (s.year || "").toString().includes(term);
        });
        renderStudents(filtered);
    }

    function openResetModal(id, studentNo) {
        currentStudentId = id;
        document.getElementById("resetStudentLabel").innerText = "Student: " + studentNo;
        document.getElementById("newPassInput").value = "";
        document.getElementById("resetModal").classList.add("show");
        document.getElementById("newPassInput").focus();
    }

    function closeResetModal() {
        document.getElementById("resetModal").classList.remove("show");
        currentStudentId = null;
    }

    function toggleResetPassword() {
        const input = document.getElementById("newPassInput");
        const btn = event.target;
        if (input.type === "password") {
            input.type = "text";
            btn.innerText = "Hide";
        } else {
            input.type = "password";
            btn.innerText = "Show";
        }
    }

    async function confirmResetPassword() {
        const newPass = document.getElementById("newPassInput").value;
        if (!newPass || newPass.length < 6) {
            alert("Password must be at least 6 characters");
            return;
        }
        const { error } = await client.from("students").update({ password: newPass }).eq("id", currentStudentId);
        if (error) alert("Failed to reset password");
        else {
            alert("Password reset successfully!");
            closeResetModal();
        }
    }

    function openDeleteStudentModal(id, studentNo, fullName) {
        studentToDelete = id;
        document.getElementById("deleteStudentText").innerHTML = 
            `You are about to permanently delete the account of:<br><strong>${fullName}</strong> (${studentNo})`;
        document.getElementById("deleteStudentModal").classList.add("show");
    }

    function closeDeleteStudentModal() {
        document.getElementById("deleteStudentModal").classList.remove("show");
        studentToDelete = null;
    }

    async function confirmDeleteStudent() {
        if (!studentToDelete) return;
        const { error } = await client.from("students").delete().eq("id", studentToDelete);
        if (error) alert("Failed to delete account");
        else {
            alert("Student account deleted");
            closeDeleteStudentModal();
            loadStudents();
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    loadStudents();
</script>
</body>
</html>
