<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Master Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .header {
            background: #6a1b9a; color: white;
            padding: 18px 25px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        .header h2 { margin: 0; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-light { background: rgba(255,255,255,0.2); color: white; }
        .btn-danger { background: #c62828; color: white; }
        .btn-warning { background: #f9a825; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h2>Master Admin – Student Accounts</h2>
        <small>Only accessible with Master Key</small>
    </div>
    <div>
        <a href="dashboard.html" class="btn btn-light">Go to Main Dashboard</a>
        <button class="btn btn-light" onclick="logout()" style="margin-left:10px;">Logout</button>
    </div>
</div>

<div class="card">
    <h3>All Registered Students</h3>
    <div id="studentsList">Loading...</div>
</div>

<script>
    const DB_URL = "https://ivwpbwdzoikmwgfpefpc.supabase.co";
    const DB_KEY = "sb_publishable_Ex2EA-5ofhwLAVv-Dj7R1w_-PKvEkqU";
    const client = supabase.createClient(DB_URL, DB_KEY);

    // Only allow Master Admin
    if (sessionStorage.getItem("isMaster") !== "true") {
        alert("Access Denied. Master Key required.");
        window.location.href = "index.html";
    }

    async function loadStudents() {
        const { data, error } = await client
            .from("students")
            .select("*")
            .order("created_at", { ascending: false });

        const container = document.getElementById("studentsList");

        if (error || !data || data.length === 0) {
            container.innerHTML = "<p>No students registered yet.</p>";
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Student Number</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach(s => {
            html += `
                <tr>
                    <td>${s.student_number}</td>
                    <td>${s.email}</td>
                    <td>${s.phone || "-"}</td>
                    <td>Year ${s.year}</td>
                    <td>
                        <button class="btn btn-warning" onclick="resetPassword('${s.id}', '${s.student_number}')">Reset Password</button>
                        <button class="btn btn-danger" onclick="deleteStudent('${s.id}', '${s.student_number}')">Delete</button>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    async function resetPassword(id, studentNo) {
        if (!confirm(`Reset password for ${studentNo}?`)) return;

        const newPass = prompt("Enter new password for this student (min 6 characters):");
        if (!newPass || newPass.length < 6) {
            alert("Password must be at least 6 characters");
            return;
        }

        const { error } = await client
            .from("students")
            .update({ password: newPass })
            .eq("id", id);

        if (error) alert("Failed to reset password");
        else alert("Password reset successfully!");
    }

    async function deleteStudent(id, studentNo) {
        if (!confirm(`Are you sure you want to DELETE the account of ${studentNo}? This cannot be undone.`)) return;

        const { error } = await client
            .from("students")
            .delete()
            .eq("id", id);

        if (error) alert("Failed to delete account");
        else {
            alert("Student account deleted");
            loadStudents();
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "index.html";
    }

    loadStudents();
</script>
</body>
</html>
