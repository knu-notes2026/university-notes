<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Notes - Dashboard</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .schools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
        .school-card { background: white; padding: 30px; text-align: center; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; border-top: 5px solid #1a73e8; transition: transform 0.2s; }
        .school-card:hover { transform: translateY(-5px); }
        .level-btn { padding: 10px 20px; margin: 5px; border: 1px solid #1a73e8; background: white; color: #1a73e8; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .level-btn.active { background: #1a73e8; color: white; }
        .notes-list { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; display: none; }
        .note-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .download-btn { background: #2ecc71; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .admin-section { background: #fff3cd; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; border: 1px solid #ffeeba; }
        select, input[type="file"] { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .upload-btn { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .upload-btn:hover { background: #1557b0; }
    </style>
</head>
<body>

<div class="header">
    <h2>Welcome to the Notes Portal</h2>
    <div>
        <span id="userDisplay" style="margin-right:15px; font-weight:bold; color: #333;"></span>
        <button onclick="logout()" style="background:#e74c3c; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Logout</button>
    </div>
</div>

<!-- Special Admin Upload Area (Visible only to admins) -->
<div class="admin-section" id="adminBox">
    <h3>🛠️ Admin Control: Upload New Notes</h3>
    <input type="file" id="fileUpload"><br><br>
    <select id="uploadSchool">
        <option value="business">School of Business</option>
        <option value="education">School of Education</option>
        <option value="natural-sciences">School of Natural Sciences</option>
        <option value="humanities">School of Humanities</option>
    </select>
    <select id="uploadLevel">
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
    </select>
    <button class="upload-btn" onclick="uploadNote()">Upload File to Cloud</button>
</div>

<h3>Select Your School</h3>
<div class="schools-grid">
    <div class="school-card" onclick="selectSchool('business')">🏢 <h3>School of Business</h3></div>
    <div class="school-card" onclick="selectSchool('education')">🍎 <h3>School of Education</h3></div>
    <div class="school-card" onclick="selectSchool('natural-sciences')">🔬 <h3>School of Natural Sciences</h3></div>
    <div class="school-card" onclick="selectSchool('humanities')">🎨 <h3>School of Humanities</h3></div>
</div>

<div class="notes-list" id="notesDisplay">
    <h3 id="selectedTitle">Notes</h3>
    <div>
        <button class="level-btn" id="lvl1" onclick="selectLevel('1')">1st Year</button>
        <button class="level-btn" id="lvl2" onclick="selectLevel('2')">2nd Year</button>
        <button class="level-btn" id="lvl3" onclick="selectLevel('3')">3rd Year</button>
        <button class="level-btn" id="lvl4" onclick="selectLevel('4')">4th Year</button>
    </div>
    <div id="fileContainer" style="margin-top:20px;"></div>
</div>

<script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Ex2EA-5ofhwLAVv-Dj7R1w_-PKvEkqU";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let selectedSchool = '';
    let selectedLevel = '1';

    // Route Protection
    const currentId = localStorage.getItem("studentId");
    const currentRole = localStorage.getItem("userRole");
    if (!currentId) { window.location.href = "index.html"; }

    document.getElementById("userDisplay").innerText = `User ID: ${currentId} (${currentRole})`;
    if (currentRole === 'admin') { document.getElementById("adminBox").style.display = "block"; }

    function selectSchool(school) {
        selectedSchool = school;
        document.getElementById("notesDisplay").style.display = "block";
        
        let displayTitle = school.replace('-', ' ').toUpperCase();
        document.getElementById("selectedTitle").innerText = "Selected: " + displayTitle;
        selectLevel('1');
    }

    function selectLevel(level) {
        selectedLevel = level;
        document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('lvl' + level).classList.add('active');
        fetchNotes();
    }

    async function fetchNotes() {
        const container = document.getElementById("fileContainer");
        container.innerHTML = "Loading notes from cloud...";

        const { data, error } = await supabase.storage.from('notes-files').list('', {
            limit: 100
        });

        if (error || !data) { container.innerHTML = "No files found."; return; }

        const prefix = `${selectedSchool}_year${selectedLevel}_`;
        const filteredFiles = data.filter(file => file.name.startsWith(prefix));

        if (filteredFiles.length === 0) {
            container.innerHTML = "📝 No notes uploaded for this academic year level yet.";
            return;
        }

        container.innerHTML = "";
        filteredFiles.forEach(file => {
            const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/notes-files/${file.name}`;
            const cleanName = file.name.replace(prefix, '');
            
            container.innerHTML += `
                <div class="note-item">
                    <span>📄 ${cleanName}</span>
                    <a href="${publicUrl}" target="_blank" class="download-btn">View / Download</a>
                </div>
            `;
        });
    }

    async function uploadNote() {
        const fileInput = document.getElementById("fileUpload");
        if (fileInput.files.length === 0) { alert("Please choose a document file first."); return; }
        
        const file = fileInput.files[0];
        const school = document.getElementById("uploadSchool").value;
        const level = document.getElementById("uploadLevel").value;
        
        const cleanOriginalName = file.name.replace(/\s+/g, '_');
        const cloudFileName = `${school}_year${level}_${cleanOriginalName}`;

        const { data, error } = await supabase.storage
            .from('notes-files')
            .upload(cloudFileName, file);

        if (error) {
            alert("Upload failed: " + error.message);
        } else {
            alert("File successfully sent to the cloud!");
            fileInput.value = "";
            fetchNotes();
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }
</script>
</body>
</html>
