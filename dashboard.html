<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Notes - Dashboard Library</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .schools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
        .school-card { background: white; padding: 30px; text-align: center; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; border-top: 5px solid #1a73e8; transition: transform 0.2s; }
        .school-card:hover { transform: translateY(-5px); }
        .level-btn { padding: 10px 18px; margin: 5px; border: 1px solid #1a73e8; background: white; color: #1a73e8; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .level-btn.active { background: #1a73e8; color: white; }
        .notes-list { background: white; padding: 25px; border-radius: 8px; margin-top: 25px; display: none; }
        .folders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .folder-card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .folder-card:hover { background: #e8f0fe; border-color: #1a73e8; transform: translateY(-3px); }
        .folder-card h4 { margin: 8px 0 0 0; color: #333; font-size: 15px; }
        .note-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .download-btn { background: #2ecc71; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .back-btn { background: #70757a; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .back-folder-btn { background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="header">
    <h2>Kwame Nkrumah University Notes Portal</h2>
    <a href="index.html" class="back-btn">← Exit Portal</a>
</div>

<h3 style="margin-top: 25px; color: #333;">Select a School Workspace</h3>

<div class="schools-grid">
    <div class="school-card" onclick="selectSchool('business')">🏢 <h3>School of Business</h3></div>
    <div class="school-card" onclick="selectSchool('education')">🍎 <h3>School of Education</h3></div>
    <div class="school-card" onclick="selectSchool('natural-sciences')">🔬 <h3>School of Natural Sciences</h3></div>
    <div class="school-card" onclick="selectSchool('humanities')">🎨 <h3>School of Humanities</h3></div>
</div>

<div class="notes-list" id="notesDisplay">
    <h3 id="selectedTitle">Notes</h3>
    
    <div id="levelButtons">
        <button class="level-btn" id="lvl1" onclick="selectLevel('1')">1st Year</button>
        <button class="level-btn" id="lvl2" onclick="selectLevel('2')">2nd Year</button>
        <button class="level-btn" id="lvl3" onclick="selectLevel('3')">3rd Year</button>
        <button class="level-btn" id="lvl4" onclick="selectLevel('4')">4th Year</button>
    </div>

    <!-- Folders View -->
    <div id="foldersView" style="display:none;">
        <h4 style="margin-top:25px; color:#555;">Select a Folder</h4>
        <div class="folders-grid" id="foldersContainer"></div>
    </div>

    <!-- Files View -->
    <div id="filesView" style="display:none;">
        <button class="back-folder-btn" onclick="showFolders()">← Back to Folders</button>
        <h4 id="currentFolderTitle" style="margin-top:10px;"></h4>
        <div id="fileContainer"></div>
    </div>
</div>

<script>
    const DB_URL = "https://ivwpbwdzoikmwgfpefpc.supabase.co";
    const DB_KEY = "sb_publishable_Ex2EA-5ofhwLAVv-Dj7R1w_-PKvEkqU";
    
    let supabaseClient = null;
    let selectedSchool = '';
    let selectedLevel = '1';
    let selectedFolder = null;

    function getSupabase() {
        if (!supabaseClient) {
            try {
                supabaseClient = supabase.createClient(DB_URL, DB_KEY);
            } catch (e) {
                console.error("Supabase init error:", e);
            }
        }
        return supabaseClient;
    }

    function selectSchool(school) {
        selectedSchool = school;
        document.getElementById("notesDisplay").style.display = "block";
        document.getElementById("selectedTitle").innerText = "Selected Workspace: " + school.replace('-', ' ').toUpperCase();
        selectLevel('1');
    }

    function selectLevel(level) {
        selectedLevel = level;
        selectedFolder = null;

        // Highlight active year button
        document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('lvl' + level).classList.add('active');

        // Show folders, hide files
        document.getElementById("foldersView").style.display = "block";
        document.getElementById("filesView").style.display = "none";

        renderFolders();
    }

    function renderFolders() {
        const container = document.getElementById("foldersContainer");
        container.innerHTML = "";

        for (let i = 1; i <= 12; i++) {
            container.innerHTML += `
                <div class="folder-card" onclick="openFolder(${i})">
                    <div style="font-size:32px;">📁</div>
                    <h4>Folder ${i}</h4>
                </div>
            `;
        }
    }

    function openFolder(folderNum) {
        selectedFolder = folderNum;
        document.getElementById("foldersView").style.display = "none";
        document.getElementById("filesView").style.display = "block";
        document.getElementById("currentFolderTitle").innerText = `Folder ${folderNum}`;
        fetchFilesInFolder();
    }

    function showFolders() {
        selectedFolder = null;
        document.getElementById("foldersView").style.display = "block";
        document.getElementById("filesView").style.display = "none";
    }

    async function fetchFilesInFolder() {
        const container = document.getElementById("fileContainer");
        container.innerHTML = "⏳ Loading files...";

        const client = getSupabase();
        if (!client) {
            container.innerHTML = "❌ Connection failed. Please refresh.";
            return;
        }

        const folderPath = `${selectedSchool}/${selectedLevel}/folder${selectedFolder}`;

        try {
            const { data, error } = await client.storage
                .from('notes-files')
                .list(folderPath, { limit: 100 });

            if (error) {
                container.innerHTML = "Error: " + error.message;
                return;
            }

            // Filter out any system placeholders
            const files = (data || []).filter(item => item.name && !item.name.startsWith('.'));

            if (files.length === 0) {
                container.innerHTML = `<p style="color:#888; margin-top:20px;">📝 This folder is empty. No notes uploaded yet.</p>`;
                return;
            }

            container.innerHTML = "";
            files.forEach(file => {
                const publicUrl = `${DB_URL}/storage/v1/object/public/notes-files/${folderPath}/${file.name}`;
                
                container.innerHTML += `
                    <div class="note-item">
                        <span>📄 ${file.name}</span>
                        <a href="${publicUrl}" target="_blank" class="download-btn">View / Download</a>
                    </div>
                `;
            });
        } catch (err) {
            console.error(err);
            container.innerHTML = "Something went wrong. Please try again.";
        }
    }
</script>
</body>
</html>
