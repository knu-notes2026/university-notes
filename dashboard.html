</div>

<script>

    /*
     * ==========================================================
     * SUPABASE CONFIGURATION
     * ==========================================================
     *
     * IMPORTANT:
     * Replace YOUR-PROJECT-ID with your actual Supabase project ID.
     *
     * Example:
     * https://abcdefghijklmnop.supabase.co
     */

    const DB_URL = "https://YOUR-PROJECT-ID.supabase.co";

    const DB_KEY =
        "sb_publishable_Ex2EA-5ofhwLAVv-Dj7R1w_-PKvEkqU";


    /*
     * Create Supabase client AFTER the CDN has loaded.
     */

    let supabaseClient = null;


    function initializeSupabase() {

        if (
            typeof window.supabase === "undefined" ||
            typeof window.supabase.createClient !== "function"
        ) {

            console.error("Supabase library failed to load.");

            showError(
                "Supabase could not be loaded. Please check your internet connection."
            );

            return false;
        }


        if (
            DB_URL.includes("YOUR-PROJECT-ID") ||
            DB_URL === "https://supabase.co"
        ) {

            showError(
                "Your Supabase Project URL has not been configured. Replace YOUR-PROJECT-ID in dashboard.html with your actual Supabase project URL."
            );

            return false;
        }


        try {

            supabaseClient =
                window.supabase.createClient(
                    DB_URL,
                    DB_KEY
                );

            return true;

        } catch (error) {

            console.error(
                "Supabase initialization error:",
                error
            );

            showError(
                "Unable to connect to Supabase: " +
                error.message
            );

            return false;
        }
    }


    /*
     * Current selection
     */

    let selectedSchool = "";
    let selectedLevel = "1";


    /*
     * Select school
     */

    function selectSchool(school) {

        selectedSchool = school;

        document.getElementById(
            "notesDisplay"
        ).style.display = "block";


        const displayTitle =
            school
                .replace("-", " ")
                .replace(/\b\w/g, letter => letter.toUpperCase());


        document.getElementById(
            "selectedTitle"
        ).innerText =
            "Selected Workspace: " + displayTitle;


        selectLevel("1");
    }


    /*
     * Select year level
     */

    function selectLevel(level) {

        selectedLevel = level;


        document
            .querySelectorAll(".level-btn")
            .forEach(button => {

                button.classList.remove("active");

            });


        const selectedButton =
            document.getElementById("lvl" + level);


        if (selectedButton) {

            selectedButton.classList.add("active");

        }


        fetchNotes();
    }


    /*
     * Display an error
     */

    function showError(message) {

        const container =
            document.getElementById("fileContainer");


        if (container) {

            container.innerHTML =
                `<div class="error">⚠️ ${escapeHtml(message)}</div>`;

        }

    }


    /*
     * Safely display filenames
     */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
     * Fetch notes from Supabase Storage
     */

    async function fetchNotes() {

        const container =
            document.getElementById("fileContainer");


        if (!selectedSchool) {

            container.innerHTML =
                '<div class="empty">Select a school first.</div>';

            return;
        }


        if (!supabaseClient) {

            if (!initializeSupabase()) {

                return;
            }
        }


        container.innerHTML =
            '<div class="loading">⏳ Loading notes from cloud...</div>';


        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .storage
                    .from("notes-files")
                    .list("", {
                        limit: 100,
                        sortBy: {
                            column: "name",
                            order: "asc"
                        }
                    });


            if (error) {

                console.error(
                    "Storage list error:",
                    error
                );

                container.innerHTML =
                    `<div class="error">
                        ⚠️ Unable to load notes.<br><br>
                        ${escapeHtml(error.message)}
                    </div>`;

                return;
            }


            if (!data || data.length === 0) {

                container.innerHTML =
                    '<div class="empty">📝 No notes have been uploaded yet.</div>';

                return;
            }


            const prefix =
                `${selectedSchool}_year${selectedLevel}_`;


            const filteredFiles =
                data.filter(file =>
                    file.name &&
                    file.name.startsWith(prefix)
                );


            if (filteredFiles.length === 0) {

                container.innerHTML =
                    '<div class="empty">📝 No notes uploaded for this academic year level yet.</div>';

                return;
            }


            container.innerHTML = "";


            filteredFiles.forEach(file => {

                const encodedFileName =
                    encodeURIComponent(file.name);


                const publicUrl =
                    `${DB_URL}/storage/v1/object/public/notes-files/${encodedFileName}`;


                const cleanName =
                    file.name.substring(prefix.length);


                const item =
                    document.createElement("div");

                item.className = "note-item";


                item.innerHTML = `

                    <span class="note-name">
                        📄 ${escapeHtml(cleanName)}
                    </span>

                    <a
                        href="${publicUrl}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="download-btn"
                    >
                        View / Download
                    </a>

                `;


                container.appendChild(item);

            });

        } catch (error) {

            console.error(
                "Unexpected error:",
                error
            );

            container.innerHTML =
                `<div class="error">
                    ⚠️ Something went wrong while loading the notes.<br><br>
                    ${escapeHtml(error.message)}
                </div>`;
        }
    }


    /*
     * Upload a note
     */

    async function uploadNote() {

        const fileInput =
            document.getElementById("fileUpload");


        const uploadButton =
            document.getElementById("uploadButton");


        const status =
            document.getElementById("uploadStatus");


        if (!fileInput.files ||
            fileInput.files.length === 0) {

            alert(
                "Please choose a document file first."
            );

            return;
        }


        if (!supabaseClient) {

            if (!initializeSupabase()) {

                return;
            }
        }


        const file =
            fileInput.files[0];


        const school =
            document.getElementById(
                "uploadSchool"
            ).value;


        const level =
            document.getElementById(
                "uploadLevel"
            ).value;


        /*
         * Replace spaces with underscores.
         */

        const cleanOriginalName =
            file.name
                .trim()
                .replace(/\s+/g, "_");


        /*
         * Remove potentially problematic characters.
         */

        const safeFileName =
            cleanOriginalName.replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


        const cloudFileName =
            `${school}_year${level}_${safeFileName}`;


        uploadButton.disabled = true;

        uploadButton.innerText =
            "⏳ Uploading...";


        status.style.display = "block";

        status.innerText =
            "Uploading file to Supabase...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .storage
                    .from("notes-files")
                    .upload(
                        cloudFileName,
                        file,
                        {
                            cacheControl: "3600",
                            upsert: true
                        }
                    );


            if (error) {

                console.error(
                    "Upload error:",
                    error
                );


                status.innerText =
                    "❌ Upload failed: " +
                    error.message;


                alert(
                    "Upload failed:\n\n" +
                    error.message
                );


                return;
            }


            console.log(
                "Upload successful:",
                data
            );


            status.innerText =
                "✅ File uploaded successfully!";


            alert(
                "File successfully uploaded to the cloud!"
            );


            fileInput.value = "";


            /*
             * Refresh notes if a school has
             * already been selected.
             */

            if (selectedSchool) {

                await fetchNotes();

            }

        } catch (error) {

            console.error(
                "Unexpected upload error:",
                error
            );


            status.innerText =
                "❌ Upload failed.";


            alert(
                "Upload failed:\n\n" +
                error.message
            );

        } finally {

            uploadButton.disabled = false;

            uploadButton.innerText =
                "Upload File to Cloud";
        }
    }


    /*
     * Initialize when dashboard loads.
     */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            initializeSupabase();

        }
    );

</script>
