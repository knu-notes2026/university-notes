<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Kwame Nkrumah University Notes Website</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            border-top: 6px solid #1a73e8;
        }
        h1 { 
            color: #1a73e8; 
            font-size: 26px; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h3 {
            color: #5f6368;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .credits { 
            font-size: 14px; 
            color: #70757a; 
            margin-bottom: 40px; 
            font-style: italic;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .enter-btn { 
            display: inline-block;
            width: 90%; 
            padding: 15px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold; 
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(26,115,232,0.3);
        }
        .enter-btn:hover { 
            background: #1557b0; 
            transform: translateY(-1px);
        }
        .enter-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to</h1>
    <h1>Kwame Nkrumah University</h1>
    <h3>Notes Website</h3>
    
    <a href="dashboard.html" class="enter-btn">Enter Into Main Notes Library</a>
    
    <div class="credits">
        Created by Kamima Nkhata
    </div>
</div>

</body>
</html>
