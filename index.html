<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Kwame Nkrumah University Notes</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e7e34">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KNU Notes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                              url('campus.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border-top: 6px solid #1a73e8;
        }
        h1 { color: #1a73e8; font-size: 26px; margin-bottom: 5px; text-transform: uppercase; }
        h3 { color: #5f6368; font-weight: 500; margin-top: 0; margin-bottom: 30px; }
        .enter-btn {
            display: inline-block; width: 90%; padding: 15px; background: #1a73e8; color: white;
            border: none; border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold;
            margin-bottom: 15px;
        }
        .enter-btn:hover { background: #1557b0; }
        .admin-btn {
            background: #f39c12; color: white; border: none; padding: 12px 28px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px;
        }
        .admin-btn:hover { background: #d35400; }
        .credits { font-size: 14px; color: #70757a; margin-top: 30px; font-style: italic; border-top: 1px solid #eee; padding-top: 15px; }
        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.65); display: none; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-box {
            background: white; padding: 30px; border-radius: 14px; width: 90%; max-width: 400px;
            transform: translateY(-40px); transition: transform 0.35s;
        }
        .modal-overlay.show .modal-box { transform: translateY(0); }
        .modal-box h3 { margin-top: 0; color: #1a73e8; }
        .password-wrapper { position: relative; margin-top: 10px; }
        .password-wrapper input {
            width: 100%; padding: 14px; font-size: 16px; border: 2px solid #ddd;
            border-radius: 8px; box-sizing: border-box;
        }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #1a73e8;
            font-size: 13px; font-weight: bold;
        }
        .modal-error { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; }
        .modal-actions { display: flex; gap: 12px; margin-top: 25px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #e0e0e0; color: #333; }
        .btn-confirm { background: #1a73e8; color: white; }
    </style>
</head>
<body>
<div class="welcome-container">
    <h1>Welcome to</h1>
    <h1>Kwame Nkrumah University</h1>
    <h3>Notes & Results Portal</h3>
    <button class="enter-btn" onclick="window.location.href='dashboard.html'">
        Enter Into Main Notes Library
    </button>
    <button class="admin-btn" onclick="openAdminModal()">
        🔑 Admin Login
    </button>
    <div class="credits">Created by Kamima Nkhata</div>
</div>

<!-- Admin Login Modal -->
<div class="modal-overlay" id="adminModal">
    <div class="modal-box">
        <h3>🔑 Admin Login</h3>
        <p style="margin:8px 0 5px; color:#555;">Enter Admin Passcode</p>
        
        <div class="password-wrapper">
            <input type="password" id="adminPassInput" placeholder="Enter passcode...">
            <button type="button" class="toggle-password" onclick="toggleAdminPassword()">Show</button>
        </div>
        
        <div class="modal-error" id="adminError">Wrong password or passcode. Please try again.</div>
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
            <button class="btn-confirm" onclick="checkAdminPassword()">Login</button>
        </div>
    </div>
</div>

<script>
    function openAdminModal() {
        document.getElementById("adminPassInput").value = "";
        document.getElementById("adminError").style.display = "none";
        document.getElementById("adminModal").classList.add("show");
        document.getElementById("adminPassInput").focus();
    }
    function closeAdminModal() {
        document.getElementById("adminModal").classList.remove("show");
    }
    function toggleAdminPassword() {
        const input = document.getElementById("adminPassInput");
        const btn = event.target;
        if (input.type === "password") {
            input.type = "text";
            btn.innerText = "Hide";
        } else {
            input.type = "password";
            btn.innerText = "Show";
        }
    }
    function checkAdminPassword() {
        const password = document.getElementById("adminPassInput").value;
        if (password === "KNUstuff@2026") {
            sessionStorage.setItem("isAdmin", "true");
            sessionStorage.setItem("isMaster", "false");
            closeAdminModal();
            window.location.href = "dashboard.html";
        } 
        else if (password === "Stuff@KNU.2026") {
            sessionStorage.setItem("isAdmin", "true");
            sessionStorage.setItem("isMaster", "true");
            closeAdminModal();
            window.location.href = "dashboard.html";
        } 
        else {
            document.getElementById("adminError").style.display = "block";
            document.getElementById("adminPassInput").value = "";
            document.getElementById("adminPassInput").focus();
        }
    }
    document.getElementById("adminPassInput").addEventListener("keyup", function(e) {
        if (e.key === "Enter") checkAdminPassword();
    });

    // ===== Service Worker Registration =====
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker
                .register("./sw.js")
                .then((reg) => console.log("Service Worker registered", reg))
                .catch((err) => console.log("Service Worker failed", err));
        });
    }
</script>
</body>
</html>
