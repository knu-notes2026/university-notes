<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Kwame Nkrumah University Notes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e7e34">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .welcome-container {
            background: white;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(30, 126, 52, 0.15);
            width: 100%;
            max-width: 520px;
            text-align: center;
            border-top: 8px solid #1e7e34;
            position: relative;
            overflow: hidden;
        }
        .university-name {
            font-size: 26px;
            font-weight: 800;
            color: #1e7e34;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            animation: fadeInDown 1s ease;
        }
        .subtitle {
            color: #2e7d32;
            font-size: 16px;
            margin-bottom: 30px;
            animation: fadeIn 1.2s ease;
        }
        .enter-btn {
            display: inline-block;
            width: 90%;
            padding: 16px;
            background: linear-gradient(135deg, #1e7e34, #2e7d32);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(30, 126, 52, 0.3);
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }
        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(30, 126, 52, 0.4);
        }
        .admin-login-btn {
            background: transparent;
            border: 2px solid #1e7e34;
            color: #1e7e34;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }
        .admin-login-btn:hover {
            background: #1e7e34;
            color: white;
        }
        .credits {
            margin-top: 30px;
            font-size: 13px;
            color: #66bb6a;
            font-style: italic;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0% { box-shadow: 0 6px 20px rgba(30, 126, 52, 0.3); }
            50% { box-shadow: 0 6px 30px rgba(30, 126, 52, 0.5); }
            100% { box-shadow: 0 6px 20px rgba(30, 126, 52, 0.3); }
        }

        /* Admin Passcode Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #e8f5e9;
            border: 2px solid #a5d6a7;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-box h3 {
            color: #1e7e34;
            margin-bottom: 15px;
        }
        .modal-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            background: white;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-cancel { background: #c8e6c9; color: #1e7e34; }
        .btn-confirm { background: #1e7e34; color: white; }
        .error-msg {
            color: #c62828;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="university-name">Kwame Nkrumah University</div>
        <div class="subtitle">Notes • Results • Tutorials Portal</div>

        <a href="dashboard.html" class="enter-btn">Enter Main Notes Library</a>

        <button class="admin-login-btn" onclick="openAdminPasscode()">Admin Login</button>

        <div class="credits">
            Developed for Kwame Nkrumah University<br>
            ICT Department © 2026
        </div>
    </div>

    <!-- Admin Passcode Modal -->
    <div class="modal-overlay" id="passcodeModal">
        <div class="modal-box">
            <h3>Admin Access</h3>
            <p style="color:#555; font-size:14px; margin-bottom:15px;">Enter the Admin Passcode</p>
            <div class="error-msg" id="passcodeError">Wrong passcode. Please try again.</div>
            <input type="password" id="adminPasscodeInput" placeholder="Enter passcode" onkeypress="if(event.key==='Enter') checkPasscode()">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closePasscodeModal()">Cancel</button>
                <button class="btn-confirm" onclick="checkPasscode()">Continue</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSCODE = localStorage.getItem("adminPasscode") || "KNUstaff@2026";
        const MASTER_PASSWORD = localStorage.getItem("masterPassword") || "Staff@KNU.2026";

        function openAdminPasscode() {
            document.getElementById("adminPasscodeInput").value = "";
            document.getElementById("passcodeError").style.display = "none";
            document.getElementById("passcodeModal").classList.add("show");
            document.getElementById("adminPasscodeInput").focus();
        }

        function closePasscodeModal() {
            document.getElementById("passcodeModal").classList.remove("show");
        }

        function checkPasscode() {
            const code = document.getElementById("adminPasscodeInput").value.trim();
            const errorDiv = document.getElementById("passcodeError");

            if (code === MASTER_PASSWORD) {
                // Master Admin direct login
                sessionStorage.setItem("isAdmin", "true");
                sessionStorage.setItem("isMaster", "true");
                sessionStorage.setItem("adminName", "Master Admin");
                sessionStorage.setItem("adminPosition", "Master Admin");
                window.location.href = "dashboard.html";
                return;
            }

            if (code === ADMIN_PASSCODE) {
                // Normal admin → go to login/register page
                window.location.href = "admin-auth.html"; // or whatever your admin login page is
                return;
            }

            errorDiv.style.display = "block";
            document.getElementById("adminPasscodeInput").value = "";
        }
    </script>
</body>
</html>
