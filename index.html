<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="hsqb-6uwqve_RcelB7izO1oWAaNR52CP8iJhJilBDk8" />
    
    <title>Welcome - Kwame Nkrumah University Notes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e7e34">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Background Image - 100% clear */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.92);
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 520px;
            text-align: center;
            border-top: 8px solid #1e7e34;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease;
        }

        .university-name {
            font-size: 28px;
            font-weight: 800;
            color: #1e7e34;
            margin-bottom: 8px;
            letter-spacing: 1px;
            animation: glow 2.5s ease-in-out infinite alternate;
        }

        .subtitle {
            color: #2e7d32;
            font-size: 16px;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .enter-btn {
            display: inline-block;
            width: 90%;
            padding: 16px;
            background: linear-gradient(135deg, #1e7e34, #2e7d32);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(30, 126, 52, 0.4);
            margin-bottom: 22px;
            animation: pulse 2.2s infinite;
        }

        .enter-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(30, 126, 52, 0.5);
        }

        .admin-login-btn {
            background: transparent;
            border: 2px solid #1e7e34;
            color: #1e7e34;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .admin-login-btn:hover {
            background: #1e7e34;
            color: white;
        }

        .credits {
            margin-top: 30px;
            font-size: 13px;
            color: #66bb6a;
            font-style: italic;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px rgba(30, 126, 52, 0.3); }
            to { text-shadow: 0 0 15px rgba(30, 126, 52, 0.6); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 8px 25px rgba(30, 126, 52, 0.4); }
            50% { box-shadow: 0 8px 35px rgba(30, 126, 52, 0.6); }
            100% { box-shadow: 0 8px 25px rgba(30, 126, 52, 0.4); }
        }

        /* Admin Passcode Modal - Light Green */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-overlay.show { display: flex; }

        .modal-box {
            background: #e8f5e9;
            border: 2px solid #a5d6a7;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-box h3 {
            color: #1e7e34;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .modal-box p {
            color: #555;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .modal-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            background: white;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-cancel { background: #c8e6c9; color: #1e7e34; }
        .btn-confirm { background: #1e7e34; color: white; }

        .error-msg {
            color: #c62828;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="university-name">Kwame Nkrumah University</div>
        <div class="subtitle">Notes🖊️ • Results🥇 • Tutorials Portal📹</div>

        <a href="dashboard.html" class="enter-btn">Enter Main Notes Library</a>

        <button class="admin-login-btn" onclick="openAdminPasscode()">Admin Login</button>

        <div class="credits">
            Developed by Kamima Nkhata 🤝🏾 & Benard cox 🙌🏽 for Kwame Nkrumah University<br>
            ICT Department © 2026
        </div>
    </div>

    <!-- Admin Passcode Modal -->
    <div class="modal-overlay" id="passcodeModal">
        <div class="modal-box">
            <h3>Admin Access</h3>
            <p>Enter the Admin Passcode</p>
            <div class="error-msg" id="passcodeError">Wrong passcode. Please try again.</div>
            <input type="password" id="adminPasscodeInput" placeholder="Enter passcode" onkeypress="if(event.key==='Enter') checkPasscode()">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closePasscodeModal()">Cancel</button>
                <button class="btn-confirm" onclick="checkPasscode()">Continue</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSCODE = localStorage.getItem("adminPasscode") || "KNUstaff@2026";
        const MASTER_PASSWORD = localStorage.getItem("masterPassword") || "Staff@KNU.2026";

        function openAdminPasscode() {
            document.getElementById("adminPasscodeInput").value = "";
            document.getElementById("passcodeError").style.display = "none";
            document.getElementById("passcodeModal").classList.add("show");
            document.getElementById("adminPasscodeInput").focus();
        }

        function closePasscodeModal() {
            document.getElementById("passcodeModal").classList.remove("show");
        }

        function checkPasscode() {
            const code = document.getElementById("adminPasscodeInput").value.trim();
            const errorDiv = document.getElementById("passcodeError");

            // Master Admin
            if (code === MASTER_PASSWORD) {
                sessionStorage.setItem("isAdmin", "true");
                sessionStorage.setItem("isMaster", "true");
                sessionStorage.setItem("adminName", "Master Admin");
                sessionStorage.setItem("adminPosition", "Master Admin");
                window.location.href = "dashboard.html";
                return;
            }

            // Normal Admin Passcode
            if (code === ADMIN_PASSCODE) {
                window.location.href = "admin-auth.html";
                return;
            }

            errorDiv.style.display = "block";
            document.getElementById("adminPasscodeInput").value = "";
        }
    </script>
</body>
</html>
