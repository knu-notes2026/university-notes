<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Kwame Nkrumah University Notes Website</title>
    <!-- Public CDN Script delivery point -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        
        /* Welcome Banner Container Layout */
        .welcome-container { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            border-top: 6px solid #1a73e8;
            margin: 40px auto;
        }
        h1 { color: #1a73e8; font-size: 26px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        h3 { color: #5f6368; font-weight: 500; margin-top: 0; margin-bottom: 30px; }
        .credits { font-size: 14px; color: #70757a; margin-top: 30px; font-style: italic; border-top: 1px solid #eee; padding-top: 15px; }
        
        .enter-btn { 
            display: inline-block; width: 90%; padding: 15px; background: #1a73e8; color: white; border: none; 
            border-radius: 6px; font-size: 18px; cursor: pointer; font-weight: bold; text-decoration: none;
            transition: all 0.2s; box-shadow: 0 2px 5px rgba(26,115,232,0.3);
            margin-bottom: 20px;
        }
        .enter-btn:hover { background: #1557b0; transform: translateY(-1px); }
        
        /* Loading Animation state layout styles */
        .enter-btn.loading {
            background: #a0aec0 !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        /* Welcome Page Admin Security Section Styling */
        .admin-toggle-btn { background: #f39c12; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 10px; }
        .admin-toggle-btn:hover { background: #d35400; }
        .admin-section { background: #fff3cd; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: left; display: none; border: 1px solid #ffeeba; }
        
        /* Main Workspace Hub Layout - Hidden by Default */
        .main-hub { display: none; width: 100%; max-width: 1100px; margin: 20px auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .schools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
        .school-card { background: white; padding: 30px; text-align: center; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; border-top: 5px solid #1a73e8; transition: transform 0.2s; }
        .school-card:hover { transform: translateY(-5px); }
        .level-btn { padding: 10px 20px; margin: 5px; border: 1px solid #1a73e8; background: white; color: #1a73e8; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .level-btn.active { background: #1a73e8; color: white; }
        
        .notes-list { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; display: none; }
        .note-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .download-btn { background: #2ecc71; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-size: 14px; font-weight: bold; }
        
        select, input[type="file"] { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 95%; }
        .upload-btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<!-- Part 1: Welcome Greeting View Box Layout -->
<div class="welcome-container" id="welcomeBox">
    <h1>Welcome to</h1>
    <h1>Kwame Nkrumah University</h1>
    <h3>Notes Website</h3>
    
    <button class="enter-btn" id="mainEntryButton" onclick="openLibraryHub()">Enter Into Main Notes Library</button>
    <br>
    
    <!-- Admin Login System Gate - Positioned directly on Welcome Page -->
    <button class="admin-toggle-btn" onclick="checkAdminAccess()">🔑 Open Admin Page Login</button>

    <!-- Admin Upload Panel Container -->
    <div class="admin-section" id="adminBox">
        <h3 style="margin-top: 0; color: #7d5a00;">🛠️ Admin Control: Upload New Notes</h3>
        <label style="font-weight: bold; font-size: 14px;">Select File:</label><br>
        <input type="file" id="fileUpload"><br><br>
        
        <label style="font-weight: bold; font-size: 14px;">Select Destination School:</label><br>
        <select id="uploadSchool">
            <option value="business">School of Business</option>
            <option value="education">School of Education</option>
            <option value="natural-sciences">School of Natural Sciences</option>
            <option value="humanities">School of Humanities</option>
        </select><br><br>
        
        <label style="font-weight: bold; font-size: 14px;">Select Study Level:</label><br>
        <select id="uploadLevel">
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select><br>
        
        <button class="upload-btn" onclick="uploadNote()">Upload File to Cloud</button>
    </div>
    
    <div class="credits">
        Created by Kamima Nkhata
    </div>
</div>

<!-- Part 2: Main Integrated Document Library Hub Workspace (Read-Only for Students) -->
<div class="main-hub" id="libraryHub">
    <div class="header">
        <h2>Kwame Nkrumah University Notes Portal</h2>
        <button onclick="goBackHome()" style="background:#70757a; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">← Exit Portal</button>
    </div>

    <h3 style="margin-top: 25px; color: #333;">Select a School Workspace</h3>
    <div class="schools-grid">
        <div class="school-card" onclick="selectSchool('business')">🏢 <h3>School of Business</h3></div>
        <div class="school-card" onclick="selectSchool('education')">🍎 <h3>School of Education</h3></div>
        <div class="school-card" onclick="selectSchool('natural-sciences')">🔬 <h3>School of Natural Sciences</h3></div>
        <div class="school-card" onclick="selectSchool('humanities')">🎨 <h3>School of Humanities</h3></div>
    </div>

    <div class="notes-list" id="notesDisplay">
        <h3 id="selectedTitle">Notes</h3>
        <div>
            <button class="level-btn" id="lvl1" onclick="selectLevel('1')">1st Year</button>
            <button class="level-btn" id="lvl2" onclick="selectLevel('2')">2nd Year</button>
            <button class="level-btn" id="lvl3" onclick="selectLevel('3')">3rd Year</button>
            <button class="level-btn" id="lvl4" onclick="selectLevel('4')">4th Year</button>
        </div>
        <div id="fileContainer" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    // Configuration links
    const DB_URL = "https://supabase.co";
    const DB_KEY = "sb_publishable_Ex2EA-5ofhwLAVv-Dj7R1w_-PKvEkqU";
    let supabaseClient = null;

    // Direct interface actions with animated transition state loops
    function openLibraryHub() {
        const entryBtn = document.getElementById("mainEntryButton");
        
        // Activate loading state style properties
        entryBtn.classList.add("loading");
        entryBtn.innerText = "⏳ Opening Library Hub...";
        entryBtn.disabled = true;

        // Perform a beautiful 1-second timeout loop before launching the grid pages
        setTimeout(() => {
            document.getElementById("welcomeBox").style.display = "none";
            document.getElementById("libraryHub").style.display = "block";
            
            // Reset button text configurations back to original states
            entryBtn.classList.remove("loading");
            entryBtn.innerText = "Enter Into Main Notes Library";
            entryBtn.disabled = false;
        }, 1000);
    }

    function goBackHome() {
        document.getElementById("libraryHub").style.display = "none";
        document.getElementById("notesDisplay").style.display = "none";
        document.getElementById("welcomeBox").style.display = "block";
    }

    // Safe lazy load connector for database interactions
    function getSupabase() {
        if (!supabaseClient) {
            try {
                if (window.supabase && window.supabase.createClient) {
                    supabaseClient = window.supabase.createClient(DB_URL, DB_KEY);
                }
            } catch (e) {
                console.error("Database boot warning: ", e);
            }
        }
        return supabaseClient;
    }

    // Passcode Verification System on the Welcome Page
    function checkAdminAccess() {
        let codePrompt = prompt("Enter Admin Secure Passcode:");
        if (codePrompt === "KNUstuff@2026") {
            alert("Access Granted! Admin Upload Panel Unlocked.");
            document.getElementById("adminBox").style.display = "block";
        } else {
            alert("Access Denied! Incorrect code string combination.");
        }
    }

    let selectedSchool = '';
    let selectedLevel = '1';

    function selectSchool(school) {
        selectedSchool = school;
        document.getElementById("notesDisplay").style.display = "block";
        let displayTitle = school.replace('-', ' ').toUpperCase();
