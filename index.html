<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Kwame Nkrumah University Notes Website">

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
    }

    .welcome-container {
        background: white;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 550px;
        text-align: center;
        border-top: 6px solid #1a73e8;
        margin: 60px auto;
    }

    h1 {
        color: #1a73e8;
        font-size: 26px;
        margin: 5px 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    h3 {
        color: #5f6368;
        font-weight: 500;
        margin-top: 10px;
        margin-bottom: 30px;
    }

    .credits {
        font-size: 14px;
        color: #70757a;
        margin-top: 30px;
        font-style: italic;
        border-top: 1px solid #eee;
        padding-top: 15px;
    }

    .enter-btn {
        display: inline-block;
        width: 90%;
        padding: 15px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
        text-decoration: none;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(26,115,232,0.3);
    }

    .enter-btn:hover {
        background: #1557b0;
        transform: translateY(-1px);
    }

    .admin-toggle-btn {
        background: #f39c12;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        margin-top: 20px;
    }

    .admin-toggle-btn:hover {
        background: #d35400;
    }

    .admin-section {
        background: #fff3cd;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        text-align: left;
        display: none;
        border: 1px solid #ffeeba;
    }

    .admin-section h3 {
        margin-top: 0;
        color: #7d5a00;
    }

    .admin-info {
        font-size: 13px;
        color: #665c3b;
        line-height: 1.5;
    }

    .admin-login-btn {
        width: 100%;
        background: #1a73e8;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
    }

    .admin-login-btn:hover {
        background: #1557b0;
    }
</style>
```

</head>

<body>

<div class="welcome-container">

```
<h1>Welcome to</h1>
<h1>Kwame Nkrumah University</h1>

<h3>Notes Website</h3>

<button class="enter-btn" onclick="openLibrary()">
    Enter Into Main Notes Library
</button>

<br>

<button class="admin-toggle-btn" onclick="checkAdminAccess()">
    🔑 Open Admin Page Login
</button>

<div class="admin-section" id="adminBox">

    <h3>🛠️ Admin Control</h3>

    <p class="admin-info">
        Admin access has been verified. Click the button below
        to open the notes management dashboard.
    </p>

    <button class="admin-login-btn" onclick="openDashboard()">
        Open Admin Dashboard
    </button>

</div>

<div class="credits">
    Created by Kamima Nkhata
</div>
```

</div>

<script>

    function openLibrary() {
        window.location.href = "dashboard.html";
    }

    function openDashboard() {
        window.location.href = "dashboard.html";
    }

    function checkAdminAccess() {

        const code = prompt("Enter Admin Secure Passcode:");

        if (code === "KNUstuff@2026") {

            alert("Access Granted! Admin Dashboard Unlocked.");

            document.getElementById("adminBox").style.display = "block";

        } else if (code !== null) {

            alert("Access Denied! Incorrect passcode.");

        }
    }

</script>

</body>
</html>
