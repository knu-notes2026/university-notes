<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Kwame Nkrumah University Notes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                              url('campus.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .welcome-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border-top: 6px solid #1a73e8;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #1a73e8;
            font-size: 26px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h3 {
            color: #5f6368;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .enter-btn {
            display: inline-block;
            width: 90%;
            padding: 15px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .enter-btn:hover {
            background: #1557b0;
            transform: translateY(-2px);
        }

        .admin-btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }
        .admin-btn:hover {
            background: #d35400;
        }

        .credits {
            font-size: 14px;
            color: #70757a;
            margin-top: 30px;
            font-style: italic;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
<div class="welcome-container">
    <h1>Welcome to</h1>
    <h1>Kwame Nkrumah University</h1>
    <h3>Notes & Results Portal</h3>

    <button class="enter-btn" onclick="window.location.href='dashboard.html'">
        Enter Into Main Notes Library
    </button>

    <button class="admin-btn" onclick="goToAdmin()">
        🔑 Admin Login
    </button>

    <div class="credits">Created by Kamima Nkhata</div>
</div>

<script>
    function goToAdmin() {
        const code = prompt("Enter Admin Secure Passcode:");
        if (code === "KNUstuff@2026") {
            sessionStorage.setItem("isAdmin", "true");
            window.location.href = "dashboard.html";
        } else {
            alert("Access Denied!");
        }
    }
</script>
</body>
</html>
