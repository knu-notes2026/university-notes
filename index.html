<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Kwame Nkrumah University Notes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e7e34">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KNU Notes">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('campus.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .welcome-container {
            background: rgba(255,255,255,0.96);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 460px;
            text-align: center;
            border-top: 6px solid #1a73e8;
        }
        h1 { color: #1a73e8; font-size: 24px; margin: 0 0 6px; text-transform: uppercase; }
        h3 { color: #5f6368; font-weight: 500; margin: 0 0 28px; font-size: 16px; }
        .enter-btn {
            display: block; width: 100%; padding: 15px; background: #1a73e8; color: white;
            border: none; border-radius: 8px; font-size: 17px; font-weight: bold;
            cursor: pointer; margin-bottom: 14px; transition: 0.2s;
        }
        .enter-btn:hover { background: #1557b0; }
        .admin-btn {
            background: #f39c12; color: white; border: none; padding: 13px 28px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;
            transition: 0.2s;
        }
        .admin-btn:hover { background: #d35400; }
        .credits { font-size: 13px; color: #777; margin-top: 28px; font-style: italic; border-top: 1px solid #eee; padding-top: 14px; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 15px; overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white; border-radius: 14px; width: 100%; max-width: 480px;
            max-height: 92vh; overflow-y: auto; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            background: #1a73e8; color: white; padding: 18px 22px;
            border-radius: 14px 14px 0 0; display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; line-height: 1; }
        .tabs { display: flex; background: #e8f0fe; }
        .tab {
            flex: 1; padding: 13px; text-align: center; cursor: pointer;
            font-weight: 600; color: #1a73e8; font-size: 14px; border: none; background: none;
        }
        .tab.active { background: white; border-bottom: 3px solid #1a73e8; }
        .form-section { padding: 22px; display: none; }
        .form-section.active { display: block; }
        label { display: block; margin-top: 12px; font-weight: 600; color: #333; font-size: 13px; }
        input, select {
            width: 100%; padding: 11px 12px; margin-top: 5px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 14px;
        }
        .name-row { display: flex; gap: 10px; }
        .name-row > div { flex: 1; }
        .phone-input { display: flex; gap: 8px; align-items: center; }
        .phone-prefix {
            background: #f1f3f4; padding: 11px 12px; border-radius: 8px;
            color: #666; font-weight: 600; font-size: 14px; white-space: nowrap;
        }
        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #1a73e8; font-size: 12px;
            font-weight: bold; cursor: pointer;
        }
        .btn-submit {
            width: 100%; padding: 13px; margin-top: 20px; background: #1a73e8;
            color: white; border: none; border-radius: 8px; font-size: 15px;
            font-weight: bold; cursor: pointer;
        }
        .btn-submit:hover { background: #1557b0; }
        .error { color: #c62828; font-size: 13px; margin-top: 8px; display: none; }
        .success { color: #2e7d32; font-size: 13px; margin-top: 8px; display: none; }
        .info-text { font-size: 13px; color: #666; margin-top: 8px; line-height: 1.4; }
    </style>
</head>
<body>
<div class="welcome-container">
    <h1>Welcome to</h1>
    <h1>Kwame Nkrumah University</h1>
    <h3>Notes & Results Portal</h3>

    <button class="enter-btn" onclick="window.location.href='dashboard.html'">
        Enter Into Main Notes Library
    </button>

    <button class="admin-btn" onclick="openAdminModal()">
        🔑 Admin Login / Register
    </button>

    <div class="credits">Created by Kamima Nkhata & Benard Cox</div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-overlay" id="adminModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Admin Portal</h3>
            <button class="close-btn" onclick="closeAdminModal()">&times;</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showAdminTab('login')">Login</button>
            <button class="tab" onclick="showAdminTab('register')">Register</button>
            <button class="tab" onclick="showAdminTab('forgot')">Forgot Password</button>
        </div>

        <!-- LOGIN -->
        <div id="admin-login" class="form-section active">
            <label>Email / Phone / Username</label>
            <input type="text" id="loginIdentity" placeholder="Email, phone or username">

            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="loginPassword" placeholder="Enter password">
                <button type="button" class="toggle-password" onclick="togglePass('loginPassword', this)">Show</button>
            </div>

            <div class="error" id="loginError"></div>
            <button class="btn-submit" onclick="adminLogin()">Login</button>
            <p class="info-text">Master Admin can also login here with the master key.</p>
        </div>

        <!-- REGISTER -->
        <div id="admin-register" class="form-section">
            <div class="name-row">
                <div>
                    <label>First Name *</label>
                    <input type="text" id="regFirstName" placeholder="First name">
                </div>
                <div>
                    <label>Middle Name</label>
                    <input type="text" id="regMiddleName" placeholder="Optional">
                </div>
            </div>

            <label>Last Name *</label>
            <input type="text" id="regLastName" placeholder="Last name">

            <label>Gender *</label>
            <select id="regGender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Email Address * (must end with @gmail.com)</label>
            <input type="email" id="regEmail" placeholder="example@gmail.com">

            <label>Phone Number *</label>
            <div class="phone-input">
                <div class="phone-prefix">+260</div>
                <input type="text" id="regPhone" placeholder="97XXXXXXX" maxlength="9">
            </div>

            <label>School *</label>
            <select id="regSchool">
                <option value="">Select School</option>
                <option value="business">School of Business</option>
                <option value="education">School of Education</option>
                <option value="natural-sciences">School of Natural Sciences</option>
                <option value="humanities">School of Humanities</option>
            </select>

            <label>Position *</label>
            <select id="regPosition" onchange="togglePositionFields()">
                <option value="">Select Position</option>
                <option value="Class Representative">Class Representative</option>
                <option value="HOD">HOD</option>
                <option value="Lecturer">Lecturer</option>
                <option value="Dean of Students">Dean of Students</option>
                <option value="Union Leader">Union Leader / Other</option>
            </select>

            <div id="customPositionBox" style="display:none;">
                <label>Specify Position *</label>
                <input type="text" id="regCustomPosition" placeholder="e.g. SRC President">
            </div>

            <div id="studentFields" style="display:none;">
                <label>Student Number *</label>
                <input type="text" id="regStudentNo" placeholder="202XXXXX" maxlength="8">

                <label>Year of Study *</label>
                <select id="regYear">
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
            </div>

            <label>Password * (minimum 6 characters)</label>
            <div class="password-wrapper">
                <input type="password" id="regPassword" placeholder="Create password">
                <button type="button" class="toggle-password" onclick="togglePass('regPassword', this)">Show</button>
            </div>

            <label>Confirm Password *</label>
            <div class="password-wrapper">
                <input type="password" id="regConfirm" placeholder="Re-enter password">
                <button type="button" class="toggle-password" onclick="togglePass('regConfirm', this)">Show</button>
            </div>

            <div class="error" id="regError"></div>
            <div class="success" id="regSuccess"></div>
            <button class="btn-submit" onclick="adminRegister()">Create Account</button>
            <p class="info-text">Your account will be reviewed by the ICT team within 24 hours.</p>
        </div>

        <!-- FORGOT PASSWORD -->
        <div id="admin-forgot" class="form-section">
            <label>Email Address *</label>
            <input type="email" id="forgotEmail" placeholder="Your registered email">

            <label>Phone Number *</label>
            <div class="phone-input">
                <div class="phone-prefix">+260</div>
                <input type="text" id="forgotPhone" placeholder="97XXXXXXX" maxlength="9">
            </div>

            <div id="forgotStudentBox" style="display:none;">
                <label>Student Number (for Class Rep / Union)</label>
                <input type="text" id="forgotStudentNo" placeholder="202XXXXX">
            </div>

            <div class="error" id="forgotError"></div>
            <div class="success" id="forgotSuccess"></div>
            <button class="btn-submit" onclick="adminForgot()">Verify & Reset</button>
        </div>
    </div>
</div>

<script>
    const DB_URL = "https://ivwpbwdzoikmwgfpefpc.supabase.co";
    const DB_KEY = "sb_publishable_Ex2EA-5ofhwLAVv-Dj7R1w_-PKvEkqU";
    const client = supabase.createClient(DB_URL, DB_KEY);
    const MASTER_KEY = "Stuff@KNU.2026";

    function openAdminModal() {
        document.getElementById("adminModal").classList.add("show");
    }
    function closeAdminModal() {
        document.getElementById("adminModal").classList.remove("show");
    }

    function showAdminTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('admin-' + tab).classList.add('active');
    }

    function togglePass(id, btn) {
        const input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
            btn.innerText = "Hide";
        } else {
            input.type = "password";
            btn.innerText = "Show";
        }
    }

    function togglePositionFields() {
        const pos = document.getElementById("regPosition").value;
        document.getElementById("customPositionBox").style.display = pos === "Union Leader" ? "block" : "none";
        document.getElementById("studentFields").style.display = 
            (pos === "Class Representative" || pos === "Union Leader") ? "block" : "none";
    }

    // ========== ADMIN REGISTER ==========
    async function adminRegister() {
        const firstName = document.getElementById("regFirstName").value.trim();
        const middleName = document.getElementById("regMiddleName").value.trim();
        const lastName = document.getElementById("regLastName").value.trim();
        const gender = document.getElementById("regGender").value;
        const email = document.getElementById("regEmail").value.trim().toLowerCase();
        const phone = document.getElementById("regPhone").value.trim();
        const school = document.getElementById("regSchool").value;
        const position = document.getElementById("regPosition").value;
        const customPosition = document.getElementById("regCustomPosition").value.trim();
        const studentNo = document.getElementById("regStudentNo").value.trim();
        const year = document.getElementById("regYear").value;
        const password = document.getElementById("regPassword").value;
        const confirm = document.getElementById("regConfirm").value;

        const errorDiv = document.getElementById("regError");
        const successDiv = document.getElementById("regSuccess");
        errorDiv.style.display = "none";
        successDiv.style.display = "none";

        // Validation
        if (!firstName || !lastName || !gender || !email || !phone || !school || !position) {
            errorDiv.innerText = "Please fill all required fields (*)";
            errorDiv.style.display = "block";
            return;
        }
        if (!email.endsWith("@gmail.com")) {
            errorDiv.innerText = "Email must end with @gmail.com";
            errorDiv.style.display = "block";
            return;
        }
        if (phone.length < 9) {
            errorDiv.innerText = "Enter a valid phone number";
            errorDiv.style.display = "block";
            return;
        }
        if (position === "Union Leader" && !customPosition) {
            errorDiv.innerText = "Please specify your position";
            errorDiv.style.display = "block";
            return;
        }
        if ((position === "Class Representative" || position === "Union Leader") && !studentNo) {
            errorDiv.innerText = "Student Number is required for this position";
            errorDiv.style.display = "block";
            return;
        }
        if (password.length < 6) {
            errorDiv.innerText = "Password must be at least 6 characters";
            errorDiv.style.display = "block";
            return;
        }
        if (password !== confirm) {
            errorDiv.innerText = "Passwords do not match";
            errorDiv.style.display = "block";
            return;
        }

        // Check if email already exists
        const { data: existing } = await client.from("admin_accounts")
            .select("email").eq("email", email).maybeSingle();
        if (existing) {
            errorDiv.innerText = "This email is already registered. Please login or use Forgot Password.";
            errorDiv.style.display = "block";
            return;
        }

        const { error } = await client.from("admin_accounts").insert({
            first_name: firstName,
            middle_name: middleName || null,
            last_name: lastName,
            gender,
            email,
            phone: "+260" + phone,
            school,
            position,
            custom_position: position === "Union Leader" ? customPosition : null,
            student_number: studentNo || null,
            year: (position === "Class Representative" || position === "Union Leader") ? year : null,
            password,
            status: "pending"
        });

        if (error) {
            errorDiv.innerText = "Registration failed: " + error.message;
            errorDiv.style.display = "block";
        } else {
            successDiv.innerText = "Account created successfully! It is now pending approval by the ICT team (within 24 hours).";
            successDiv.style.display = "block";
        }
    }

    // ========== ADMIN LOGIN ==========
    async function adminLogin() {
        const identity = document.getElementById("loginIdentity").value.trim();
        const password = document.getElementById("loginPassword").value;
        const errorDiv = document.getElementById("loginError");
        errorDiv.style.display = "none";

        // Master Key (silent)
        if (password === MASTER_KEY) {
            sessionStorage.setItem("isAdmin", "true");
            sessionStorage.setItem("isMaster", "true");
            sessionStorage.setItem("adminName", "Master Admin");
            sessionStorage.setItem("adminPosition", "Master Admin");
            closeAdminModal();
            window.location.href = "dashboard.html";
            return;
        }

        if (!identity || !password) {
            errorDiv.innerText = "Please enter your email/phone and password";
            errorDiv.style.display = "block";
            return;
        }

        // Try login by email or phone
        let query = client.from("admin_accounts").select("*");
        if (identity.includes("@")) {
            query = query.eq("email", identity.toLowerCase());
        } else {
            query = query.or(`phone.eq.+260${identity},phone.eq.${identity}`);
        }

        const { data, error } = await query.eq("password", password).maybeSingle();

        if (error || !data) {
            errorDiv.innerText = "Invalid credentials";
            errorDiv.style.display = "block";
            return;
        }

        if (data.status === "pending") {
            errorDiv.innerText = "Your account is still pending approval. Please wait for ICT team.";
            errorDiv.style.display = "block";
            return;
        }
        if (data.status === "denied") {
            errorDiv.innerText = "Your account request was denied.";
            errorDiv.style.display = "block";
            return;
        }

        // Success
        sessionStorage.setItem("isAdmin", "true");
        sessionStorage.setItem("isMaster", "false");
        sessionStorage.setItem("adminId", data.id);
        sessionStorage.setItem("adminName", `${data.first_name} ${data.last_name}`);
        sessionStorage.setItem("adminPosition", data.custom_position || data.position);
        sessionStorage.setItem("adminSchool", data.school);
        sessionStorage.setItem("adminProfilePic", data.profile_pic || "");
        sessionStorage.setItem("needsProfilePic", data.profile_pic ? "false" : "true");

        closeAdminModal();
        window.location.href = "dashboard.html";
    }

    // ========== FORGOT PASSWORD (simplified for now) ==========
    async function adminForgot() {
        const email = document.getElementById("forgotEmail").value.trim().toLowerCase();
        const phone = document.getElementById("forgotPhone").value.trim();
        const errorDiv = document.getElementById("forgotError");
        const successDiv = document.getElementById("forgotSuccess");
        errorDiv.style.display = "none";
        successDiv.style.display = "none";

        if (!email || !phone) {
            errorDiv.innerText = "Please enter email and phone number";
            errorDiv.style.display = "block";
            return;
        }

        const { data } = await client.from("admin_accounts")
            .select("*")
            .eq("email", email)
            .eq("phone", "+260" + phone)
            .maybeSingle();

        if (!data) {
            errorDiv.innerText = "No account found with these details";
            errorDiv.style.display = "block";
            return;
        }

        // For security we just inform them for now
        successDiv.innerText = "Account found. Please contact the Master Admin / ICT team to reset your password.";
        successDiv.style.display = "block";
    }

    // Service Worker
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
    }
</script>
</body>
</html>
